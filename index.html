<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Shopping Assistant</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0C0D12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #141416;
      --panel: #1D1E22;
      --card: #25272E;
      --card-hover: #2E303A;
      --border: #32353E;
      --border-light: #414552;
      
      --text-main: #FFFFFF;
      --text-sub: #A1A4B0;
      --text-muted: #6B7082;
      
      --blue: #0071E3;
      --blue-muted: rgba(0, 113, 227, 0.12);
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      width: 100%;
    }

    /* Master Layout */
    .app-container {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      min-width: 0;
    }

    @media (max-width: 880px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      .side-panel {
        position: static !important;
      }
    }

    /* Left Control Sidebar (Sharp 0px Structural Block) */
    .side-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: sticky;
      top: 24px;
      min-width: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .app-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .app-desc {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .select-dropdown {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 4px 8px;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }
    .select-dropdown:hover {
      border-color: var(--border-light);
      color: #FFFFFF;
    }

    /* Siri Orb Controller (Soft 50% Circular Contrast) */
    .voice-control-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .orb-canvas {
      width: 120px;
      height: 120px;
      cursor: pointer;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .orb-canvas:hover { transform: scale(1.03); }
    .orb-canvas:active { transform: scale(0.97); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sub);
    }

    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    /* Live Transcript Display (Sharp 0px Card) */
    .transcript-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 10px 12px;
      min-height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .transcript-text {
      font-size: 12px;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 1.35;
    }

    .transcript-status {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    /* Input Field & Buttons (Sharp 0px Precision Controls) */
    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .text-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 8px 10px;
      font-size: 12px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.15s;
    }
    .text-input:focus {
      border-color: var(--blue);
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }

    .btn-action-primary {
      background: #FFFFFF;
      color: #0C0D12;
      border: 1px solid transparent;
      border-radius: 0px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-action-primary:hover {
      background: #E1E3EB;
    }

    .btn-action-secondary {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-action-secondary:hover {
      color: var(--red);
      border-color: rgba(255, 69, 58, 0.4);
      background: rgba(255, 69, 58, 0.06);
    }

    .shortcut-hints {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .shortcut-hints kbd {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 1px 4px;
      color: var(--text-sub);
    }

    /* Right Main Panel (Sharp 0px Structural Frame) */
    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
      max-width: 100%;
    }

    /* Top Action Bar (Sharp 0px Technical Toolbar) */
    .top-action-bar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-width: 0;
    }

    .bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .item-count-tag {
      background: var(--blue-muted);
      color: var(--blue);
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 12px;
    }

    .bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-store-checkout {
      background: var(--orange);
      color: #0C0D12;
      border: none;
      border-radius: 0px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-store-checkout:hover { opacity: 0.9; }

    .btn-icon-action {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 0px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-icon-action:hover {
      border-color: var(--border-light);
      color: #FFFFFF;
    }

    /* Smart Suggestions Bar (Soft Capsule Chips) */
    .suggestions-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .suggestions-header {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .pills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
    }

    .chip-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .chip-item:hover {
      border-color: var(--border-light);
      background: var(--card-hover);
      color: #FFFFFF;
    }
    .chip-item.substitute {
      border-color: rgba(175, 82, 222, 0.35);
      background: rgba(175, 82, 222, 0.08);
      color: #BF5AF2;
    }
    .chip-item.substitute:hover {
      background: rgba(175, 82, 222, 0.18);
      color: #FFFFFF;
    }

    /* Aisle Group Cards (Sharp 0px architectural block with color stripe) */
    .aisles-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 12px;
      width: 100%;
      min-width: 0;
    }

    .aisle-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-light);
      border-radius: 0px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      transition: border-color 0.15s;
    }
    .aisle-block:hover {
      border-color: var(--border-light);
    }
    .aisle-block[data-category="Produce"] { border-left-color: var(--green); }
    .aisle-block[data-category="Dairy & Eggs"] { border-left-color: var(--blue); }
    .aisle-block[data-category="Bakery"] { border-left-color: var(--orange); }
    .aisle-block[data-category="Pantry"] { border-left-color: #BF5AF2; }
    .aisle-block[data-category="Beverages"] { border-left-color: #5AC8FA; }
    .aisle-block[data-category="Snacks"] { border-left-color: #FF2D55; }
    .aisle-block[data-category="Personal Care"] { border-left-color: #64D2FF; }
    .aisle-block[data-category="Household"] { border-left-color: #FFD60A; }

    .aisle-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .aisle-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .aisle-count {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Item List Row */
    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      min-width: 0;
    }
    .product-row:last-child { border-bottom: none; }

    .product-row.done {
      opacity: 0.4;
    }
    .product-row.done .product-title {
      text-decoration: line-through;
    }

    .product-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
      flex-wrap: wrap;
    }

    .custom-check {
      width: 16px;
      height: 16px;
      border: 1.2px solid var(--text-muted);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.12s;
    }
    .custom-check:hover {
      border-color: var(--green);
    }
    .custom-check.checked {
      background: var(--green);
      border-color: var(--green);
    }
    .custom-check.checked::after {
      content: '✓';
      font-size: 10px;
      font-weight: 800;
      color: #0C0D12;
    }

    .product-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      word-break: normal;
      overflow-wrap: break-word;
    }

    .brand-tag {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--blue);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 0px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .product-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      margin-left: auto;
    }

    /* Compact Stepper (Sharp Segmented Box) */
    .compact-stepper {
      display: inline-flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0px;
      overflow: hidden;
    }

    .btn-step-action {
      background: transparent;
      border: none;
      color: var(--text-sub);
      width: 18px;
      height: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-step-action:hover {
      background: var(--card);
      color: #FFFFFF;
    }

    .qty-display {
      color: var(--text-main);
      font-size: 10px;
      font-weight: 600;
      padding: 0 4px;
      white-space: nowrap;
    }

    .btn-item-link {
      width: 20px;
      height: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }
    .btn-item-link:hover {
      color: var(--blue);
      border-color: var(--blue);
    }

    .btn-item-delete {
      width: 18px;
      height: 20px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .btn-item-delete:hover {
      color: var(--red);
    }

    /* Search Results Shelf (Sharp Technical Block) */
    .search-results-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    .search-item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .search-item-name { font-size: 12px; font-weight: 600; color: #FFFFFF; }
    .search-item-brand { font-size: 10px; color: var(--text-muted); }
    .search-item-price { font-size: 12px; font-weight: 700; color: var(--green); margin-top: 2px; }
    
    .btn-add-result {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #FFFFFF;
      border-radius: 0px;
      padding: 4px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      text-align: center;
    }
    .btn-add-result:hover {
      background: var(--card-hover);
      border-color: var(--border-light);
    }

    .empty-state-notice {
      color: var(--text-muted);
      font-size: 12.5px;
      text-align: center;
      padding: 36px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* Toast Notification (Soft Floating Banner) */
    .toast-popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1C1F2B;
      border: 1px solid var(--border-light);
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 1000;
      transition: all 0.2s;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Left Inspector Sidebar -->
    <aside class="side-panel">
      <div class="panel-header">
        <div class="app-title-wrap">
          <div class="app-title">Voice Assistant</div>
          <div class="app-desc">Grocery Intelligence</div>
        </div>
        <select id="langSelect" class="select-dropdown">
          <option value="en-IN">en-IN</option>
          <option value="en-US">en-US</option>
          <option value="en-GB">en-GB</option>
          <option value="hi-IN">hi-IN</option>
        </select>
      </div>

      <!-- Voice Trigger Stage -->
      <div class="voice-control-box">
        <canvas id="orbCanvas" class="orb-canvas" width="120" height="120" title="Click to speak"></canvas>
        <div class="status-pill">
          <span class="status-indicator"></span>
          <span id="statusIndicatorText">Hands-Free Active</span>
        </div>
      </div>

      <!-- Live Transcript -->
      <div class="transcript-card">
        <div id="transcriptHero" class="transcript-text">“Speak your items or tap the mic”</div>
        <div id="statusText" class="transcript-status">Auto-stops after 800ms silence</div>
      </div>

      <!-- Text Input & Actions -->
      <div class="input-wrapper">
        <input type="text" id="commandInput" class="text-input" placeholder="Type items (e.g. 4 apples 5 oranges)...">
        <div class="button-group">
          <button id="sendBtn" class="btn-action-primary">Add to List ↵</button>
          <button id="clearBtn" class="btn-action-secondary">Clear</button>
        </div>
      </div>

      <div class="shortcut-hints">
        <span><kbd>Space</kbd> Voice</span>
        <span><kbd>/</kbd> Type</span>
        <span><kbd>C</kbd> Copy</span>
      </div>
    </aside>

    <!-- Right Content Panel -->
    <main class="main-panel">
      <!-- Top Action Bar -->
      <div class="top-action-bar">
        <div class="bar-left">
          <span class="bar-title">Shopping List</span>
          <span id="itemCountTag" class="item-count-tag">0 items</span>
        </div>
        <div class="bar-right">
          <select id="storeSelect" class="select-dropdown">
            <option value="Amazon Fresh">Amazon Fresh</option>
            <option value="Blinkit">Blinkit (10-min)</option>
            <option value="Zepto">Zepto (10-min)</option>
            <option value="Instamart">Swiggy Instamart</option>
            <option value="BigBasket">BigBasket</option>
          </select>
          <button id="storeCheckoutBtn" class="btn-store-checkout">Open in Store ↗</button>
          <button id="copyOrderBtn" class="btn-icon-action">📋 Copy</button>
        </div>
      </div>

      <!-- Recommendations & Substitutes Shelf -->
      <div class="suggestions-container">
        <div class="suggestions-header">Smart Suggestions & Substitutes</div>
        <div id="pillsGrid" class="pills-grid"></div>
      </div>

      <!-- Dynamic Search & Price Filter Shelf -->
      <div id="searchSection" class="search-results-box" style="display: none;">
        <div class="suggestions-header">Search Results & Price Filter</div>
        <div id="searchGrid" class="search-cards-grid"></div>
      </div>

      <!-- Categorized Aisle List -->
      <div id="aislesContainer" class="aisles-layout">
        <div class="empty-state-notice">
          <div>🛒 Shopping list is empty.</div>
          <div style="font-size: 11px;">Speak or type: <em>“Add 4 apples and 5 oranges”</em></div>
        </div>
      </div>
    </main>
  </div>

  <div id="toastContainer"></div>

  <script>
    // ─── CATEGORY ICONS & THEMES ───
    const CATEGORY_ICONS = {
      "Produce": "🍏",
      "Dairy & Eggs": "🥛",
      "Bakery": "🍞",
      "Pantry": "🌾",
      "Beverages": "☕",
      "Snacks": "🍿",
      "Personal Care": "🧼",
      "Household": "🧹",
      "Meat & Seafood": "🥩",
      "Frozen": "❄️"
    };

    // ─── TOAST NOTIFICATION ───
    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast-popup';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 2200);
    }

    // ─── RESTRAINED APPLE/GOOGLE VOICE ORB ───
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    let isRecording = false;
    let isSpeaking = false;
    let orbPhase = 0;
    let targetEnergy = 0.05;
    let currentEnergy = 0.05;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let silenceStart = null;
    let hasSpoken = false;

    function renderVoiceOrb() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseRadius = 36;

      currentEnergy += (targetEnergy - currentEnergy) * 0.15;
      orbPhase += 0.03 + currentEnergy * 0.1;

      // Concentric rings (Google Material / Apple style)
      const ringCount = 3;
      for (let i = ringCount; i >= 1; i--) {
        ctx.beginPath();
        const r = baseRadius + (i * 8) + (currentEnergy * 16 * (i / ringCount));
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        if (isRecording) {
          ctx.strokeStyle = `rgba(0, 113, 227, ${0.18 * (1 / i)})`;
          ctx.fillStyle = `rgba(0, 113, 227, ${0.04 * (1 / i)})`;
        } else if (isSpeaking) {
          ctx.strokeStyle = `rgba(52, 199, 89, ${0.18 * (1 / i)})`;
          ctx.fillStyle = `rgba(52, 199, 89, ${0.04 * (1 / i)})`;
        } else {
          ctx.strokeStyle = `rgba(255, 255, 255, ${0.04 * (1 / i)})`;
          ctx.fillStyle = `rgba(255, 255, 255, 0.01)`;
        }
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();
      }

      // Center Core Button
      ctx.beginPath();
      ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
      if (isRecording) {
        ctx.fillStyle = '#0071E3';
      } else if (isSpeaking) {
        ctx.fillStyle = '#34C759';
      } else {
        ctx.fillStyle = '#2C2D35';
      }
      ctx.fill();
      ctx.strokeStyle = isRecording ? '#47A3FF' : '#3F4352';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Microphone Glyph
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(cx - 3, cy - 7, 6, 9, 3);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy - 2, 5, 0, Math.PI);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = '#FFFFFF';
      ctx.stroke();

      requestAnimationFrame(renderVoiceOrb);
    }
    renderVoiceOrb();

    // ─── VOICE RECORDING & VAD ───
    canvas.addEventListener('click', toggleAudioRecording);

    function toggleAudioRecording() {
      if (isRecording) stopAudioRecording();
      else startAudioRecording();
    }

    async function startAudioRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
            sampleRate: { ideal: 16000 }
          }
        });
        isRecording = true;
        hasSpoken = false;
        silenceStart = null;
        targetEnergy = 0.25;

        document.getElementById('statusIndicatorText').textContent = 'Listening...';
        document.getElementById('statusText').textContent = 'Hearing voice in real time...';
        document.getElementById('transcriptHero').textContent = '“Listening...”';

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const checkVolume = () => {
          if (!isRecording) return;
          analyser.getByteFrequencyData(dataArray);
          const sum = dataArray.reduce((a, b) => a + b, 0);
          const avg = sum / dataArray.length;
          targetEnergy = Math.min(1.0, Math.max(0.08, avg / 35.0));

          if (avg > 11) {
            hasSpoken = true;
            silenceStart = null;
            document.getElementById('statusText').textContent = 'Capturing speech...';
          } else if (hasSpoken) {
            if (!silenceStart) silenceStart = Date.now();
            else if (Date.now() - silenceStart > 1800) {
              stopAudioRecording();
              return;
            }
          }

          requestAnimationFrame(checkVolume);
        };
        checkVolume();

        audioChunks = [];
        let mime = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mime)) {
          mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        }

        mediaRecorder = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 48000 });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = uploadRecordedAudio;
        mediaRecorder.start(250);

      } catch (err) {
        document.getElementById('statusText').textContent = 'Microphone permission required';
        isRecording = false;
      }
    }

    function stopAudioRecording() {
      if (isRecording) {
        isRecording = false;
        targetEnergy = 0.05;
        document.getElementById('statusIndicatorText').textContent = 'Processing...';
        document.getElementById('statusText').textContent = 'Parsing grocery intent...';
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if (audioContext) audioContext.close();
      }
    }

    async function uploadRecordedAudio() {
      if (audioChunks.length === 0) {
        document.getElementById('statusText').textContent = 'No voice detected';
        document.getElementById('statusIndicatorText').textContent = 'Hands-Free Active';
        return;
      }

      const blob = new Blob(audioChunks, { type: mediaRecorder ? mediaRecorder.mimeType : 'audio/webm' });
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');

      try {
        const resp = await fetch('/api/voice-audio', { method: 'POST', body: formData });
        document.getElementById('statusIndicatorText').textContent = 'Hands-Free Active';
        if (resp.ok) {
          const data = await resp.json();
          handleBackendResponse(data);
        } else {
          const errData = await resp.json().catch(() => ({}));
          document.getElementById('statusText').textContent = (errData.error || 'Server error');
        }
      } catch (err) {
        document.getElementById('statusText').textContent = 'Network error: ' + err.message;
        document.getElementById('statusIndicatorText').textContent = 'Hands-Free Active';
      }
    }

    // ─── MANUAL TEXT COMMAND ───
    const commandInput = document.getElementById('commandInput');
    document.getElementById('sendBtn').addEventListener('click', handleTextSubmit);
    commandInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleTextSubmit(); });

    async function handleTextSubmit() {
      const text = commandInput.value.trim();
      if (!text) return;
      commandInput.value = '';
      document.getElementById('statusText').textContent = 'Processing command...';
      document.getElementById('transcriptHero').textContent = `“${text}”`;

      try {
        const resp = await fetch('/api/voice-command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript: text })
        });
        const data = await resp.json();
        handleBackendResponse(data);
      } catch (err) {
        document.getElementById('statusText').textContent = 'Error: ' + err.message;
      }
    }

    document.getElementById('clearBtn').addEventListener('click', async () => {
      await fetch('/api/cart', { method: 'DELETE' });
      document.getElementById('statusText').textContent = 'Cart cleared';
      document.getElementById('transcriptHero').textContent = '“Shopping list is empty”';
      document.getElementById('searchSection').style.display = 'none';
      renderCart({});
      showToast('Shopping list cleared');
    });

    // ─── KEYBOARD SHORTCUTS ───
    document.addEventListener('keydown', e => {
      if (document.activeElement === commandInput) return;
      if (e.key === ' ' || e.key === 'v' || e.key === 'V') {
        e.preventDefault();
        toggleAudioRecording();
      } else if (e.key === '/') {
        e.preventDefault();
        commandInput.focus();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        document.getElementById('copyOrderBtn').click();
      }
    });

    // ─── BACKEND RESPONSE HANDLER ───
    function handleBackendResponse(data) {
      if (!data) return;
      if (data.error) {
        document.getElementById('statusText').textContent = 'Notice: ' + data.error;
        return;
      }

      document.getElementById('transcriptHero').textContent = `“${data.transcript || 'Command processed'}”`;
      const msgs = Array.isArray(data.messages) ? data.messages.join(' • ') : (data.messages || data.tts_message || 'Cart updated');
      document.getElementById('statusText').textContent = msgs;

      renderCart(data.cart || {});
      renderRecommendations(data.seasonal_picks || [], data.history_recs || [], data.substitutes || []);

      if (data.search_results && data.search_results.length > 0) {
        renderSearchResults(data.search_results);
      } else {
        document.getElementById('searchSection').style.display = 'none';
      }

      if (data.tts_message) {
        speakBrowserTTS(data.tts_message);
      }
    }

    function speakBrowserTTS(text) {
      if (!('speechSynthesis' in window)) return;
      isSpeaking = true;
      targetEnergy = 0.45;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = document.getElementById('langSelect').value;
      utter.onend = () => { isSpeaking = false; targetEnergy = 0.05; };
      utter.onerror = () => { isSpeaking = false; targetEnergy = 0.05; };
      window.speechSynthesis.speak(utter);
    }

    // ─── RENDERING CARTS & AISLES ───
    let currentCartItems = [];

    function renderCart(categorized) {
      const container = document.getElementById('aislesContainer');
      container.innerHTML = '';
      currentCartItems = [];
      let totalCount = 0;

      const keys = Object.keys(categorized);
      if (keys.length === 0) {
        container.innerHTML = `
          <div class="empty-state-notice">
            <div>🛒 Shopping list is empty.</div>
            <div style="font-size: 11px;">Speak or type: <em>“Add 4 apples and 5 oranges”</em></div>
          </div>`;
        document.getElementById('itemCountTag').textContent = '0 items';
        return;
      }

      keys.forEach(cat => {
        const items = categorized[cat];
        totalCount += items.length;
        const block = document.createElement('div');
        block.className = 'aisle-block';
        block.setAttribute('data-category', cat);

        const icon = CATEGORY_ICONS[cat] || '📦';
        const titleRow = document.createElement('div');
        titleRow.className = 'aisle-title-row';
        titleRow.innerHTML = `
          <div class="aisle-name">
            <span>${icon}</span>
            <span>${cat}</span>
          </div>
          <span class="aisle-count">${items.length} ${items.length === 1 ? 'item' : 'items'}</span>
        `;
        block.appendChild(titleRow);

        items.forEach(itm => {
          currentCartItems.push(itm);
          const row = document.createElement('div');
          row.className = 'product-row' + (itm.completed ? ' done' : '');

          const left = document.createElement('div');
          left.className = 'product-left';

          const chk = document.createElement('div');
          chk.className = 'custom-check' + (itm.completed ? ' checked' : '');
          chk.onclick = () => toggleItemDone(itm.base_name, row, chk);
          left.appendChild(chk);

          const name = document.createElement('span');
          name.className = 'product-title';
          name.textContent = itm.name;
          left.appendChild(name);

          if (itm.brand_hint) {
            const brand = document.createElement('span');
            brand.className = 'brand-tag';
            brand.textContent = itm.brand_hint;
            left.appendChild(brand);
          }

          const right = document.createElement('div');
          right.className = 'product-right';

          // Stepper: [-] [qty] [+]
          const stepper = document.createElement('div');
          stepper.className = 'compact-stepper';
          stepper.innerHTML = `
            <button class="btn-step-action" onclick="changeItemQty('${itm.base_name.replace(/'/g, "\\'")}', -1)">−</button>
            <span class="qty-display">${itm.quantity} ${itm.unit}</span>
            <button class="btn-step-action" onclick="changeItemQty('${itm.base_name.replace(/'/g, "\\'")}', 1)">+</button>
          `;
          right.appendChild(stepper);

          // Store Link Button
          const storeBtn = document.createElement('button');
          storeBtn.className = 'btn-item-link';
          storeBtn.innerHTML = '↗';
          storeBtn.title = `Search ${itm.name} on ${document.getElementById('storeSelect').value}`;
          storeBtn.onclick = () => openSingleStoreItem(itm.name);
          right.appendChild(storeBtn);

          // Delete Button
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-item-delete';
          delBtn.innerHTML = '×';
          delBtn.title = 'Remove';
          delBtn.onclick = () => removeItem(itm.base_name);
          right.appendChild(delBtn);

          row.appendChild(left);
          row.appendChild(right);
          block.appendChild(row);
        });

        container.appendChild(block);
      });

      document.getElementById('itemCountTag').textContent = `${totalCount} ${totalCount === 1 ? 'item' : 'items'}`;
    }

    function toggleItemDone(base_name, row, chk) {
      const isDone = row.classList.toggle('done');
      chk.classList.toggle('checked', isDone);
      showToast(isDone ? `Completed: ${base_name}` : `Restored: ${base_name}`);
    }

    async function changeItemQty(base_name, delta) {
      if (delta > 0) {
        commandInput.value = `Add 1 ${base_name}`;
      } else {
        commandInput.value = `Remove 1 ${base_name}`;
      }
      await handleTextSubmit();
    }

    function renderRecommendations(seasonal, history, substitutes = []) {
      const grid = document.getElementById('pillsGrid');
      grid.innerHTML = '';

      if (substitutes && substitutes.length > 0) {
        substitutes.slice(0, 3).forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'chip-item substitute';
          btn.innerHTML = `<span>🔄</span><span>Try ${item}</span>`;
          btn.onclick = () => quickAddItem(item);
          grid.appendChild(btn);
        });
      }

      seasonal.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'chip-item';
        btn.innerHTML = `<span>🌱</span><span>${item}</span>`;
        btn.onclick = () => quickAddItem(item);
        grid.appendChild(btn);
      });

      history.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'chip-item';
        btn.innerHTML = `<span>+</span><span>${item}</span>`;
        btn.onclick = () => quickAddItem(item);
        grid.appendChild(btn);
      });
    }

    function renderSearchResults(products) {
      const section = document.getElementById('searchSection');
      const grid = document.getElementById('searchGrid');
      grid.innerHTML = '';
      section.style.display = 'flex';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'search-item-card';
        card.innerHTML = `
          <div class="search-item-name">${p.name}</div>
          <div class="search-item-brand">${p.brand} • Score ${p.nutriscore}</div>
          <div class="search-item-price">${p.price}</div>
          <button class="btn-add-result" onclick="quickAddItem('${p.name.replace(/'/g, "\\'")}')">+ Add to List</button>
        `;
        grid.appendChild(card);
      });
    }

    function quickAddItem(name) {
      commandInput.value = `Add 1 ${name}`;
      handleTextSubmit();
      showToast(`Added ${name}`);
    }

    async function removeItem(name) {
      commandInput.value = `Remove ${name}`;
      await handleTextSubmit();
      showToast(`Removed ${name}`);
    }

    // ─── STORE ACTIONS ───
    function getStoreUrl(item_name) {
      const store = document.getElementById('storeSelect').value;
      const q = encodeURIComponent(item_name);
      if (store === 'Amazon Fresh') return `https://www.amazon.in/s?k=${q}&i=fresh`;
      if (store === 'Blinkit') return `https://blinkit.com/s/?q=${q}`;
      if (store === 'Zepto') return `https://www.zeptonow.com/search?q=${q}`;
      if (store === 'Instamart') return `https://www.swiggy.com/instamart/search?custom_back=true&query=${q}`;
      return `https://www.bigbasket.com/ps/?q=${q}`;
    }

    function openSingleStoreItem(item_name) {
      window.open(getStoreUrl(item_name), '_blank');
    }

    document.getElementById('storeCheckoutBtn').addEventListener('click', () => {
      if (currentCartItems.length === 0) {
        showToast('Shopping list is empty');
        return;
      }
      currentCartItems.slice(0, 3).forEach(itm => {
        window.open(getStoreUrl(itm.name), '_blank');
      });
      showToast(`Opened ${Math.min(currentCartItems.length, 3)} items on ${document.getElementById('storeSelect').value}`);
    });

    document.getElementById('copyOrderBtn').addEventListener('click', () => {
      if (currentCartItems.length === 0) {
        showToast('Shopping list is empty');
        return;
      }
      const lines = ["🛒 SHOPPING LIST", "──────────────────"];
      currentCartItems.forEach(i => {
        const brand = i.brand_hint ? ` [${i.brand_hint}]` : '';
        lines.push(`• ${i.name}${brand} — ${i.quantity} ${i.unit} (${i.category})`);
      });
      lines.push("──────────────────");
      lines.push(`Total: ${currentCartItems.length} items`);
      navigator.clipboard.writeText(lines.join('\n'));
      showToast('Copied to clipboard');
    });

    // Initial load
    fetch('/api/cart')
      .then(r => r.json())
      .then(data => handleBackendResponse({ cart: data.cart || {}, seasonal_picks: ["Sweet Corn", "Watermelon", "Mangoes"], history_recs: ["Milk", "Bread", "Eggs"] }))
      .catch(() => {});
  </script>
</body>
</html>
