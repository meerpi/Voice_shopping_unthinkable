<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Shopping Assistant</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#08090C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090C;
      --panel-bg: #101216;
      --card-bg: #13161C;
      --card-hover: #1A1E26;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --text: #EDEDED;
      --text-muted: #6B7280;
      --text-sub: #9CA3AF;
      --primary: #FFFFFF;
      --accent-blue: #38BDF8;
      --accent-orange: #FF9900;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 1180px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
    }

    /* Left Hero Stage */
    .hero-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .lang-pill {
      background: #16181F;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      outline: none;
    }

    /* Siri Living Orb */
    .orb-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }

    .siri-orb-canvas {
      width: 130px;
      height: 130px;
      cursor: pointer;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .siri-orb-canvas:active {
      transform: scale(0.95);
    }

    .status-badge {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
      text-align: center;
      min-height: 18px;
    }

    .transcript-hero {
      font-size: 14px;
      font-weight: 500;
      color: #F3F4F6;
      text-align: center;
      line-height: 1.4;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .diag-caption {
      font-size: 11px;
      color: #4B5563;
      font-weight: 500;
      text-align: center;
    }

    /* Inputs & Action Controls */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .command-input {
      background: #16181F;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.2s;
    }

    .command-input:focus {
      border-color: rgba(255, 255, 255, 0.35);
      background: #1B1E26;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-primary {
      background: #FFFFFF;
      color: #08090C;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background: #E5E7EB;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ghost:hover {
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.06);
    }

    /* Right Bento Board */
    .board-stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toolbar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .tool-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-store {
      background: var(--accent-orange);
      color: #08090C;
      border: none;
      border-radius: 10px;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-store:hover {
      background: #FFAA2B;
    }

    .btn-tool {
      background: #16181F;
      color: #D1D5DB;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tool:hover {
      background: #20242E;
      border-color: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
    }

    /* Shelf Bento Card */
    .bento-shelf {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shelf-label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .pill-rack {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .pill-rack::-webkit-scrollbar { display: none; }

    .suggestion-pill {
      background: #16181F;
      border: 1px solid var(--border-subtle);
      color: var(--text-sub);
      border-radius: 10px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-pill:hover {
      background: #1F232D;
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Aisles Grid */
    .aisles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .aisle-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .aisle-header {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .item-name {
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
    }

    .item-qty {
      color: var(--text-sub);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .brand-badge {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-link-store {
      width: 22px;
      height: 22px;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
      border-radius: 11px;
      font-size: 11px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-del {
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      background: transparent;
      font-size: 15px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn-del:hover { color: var(--danger); }

    /* Search Results Grid */
    .search-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .product-name { color: #FFFFFF; font-size: 12px; font-weight: 600; }
    .product-brand { color: var(--text-muted); font-size: 10px; }
    .product-price { color: #FFFFFF; font-weight: 700; font-size: 13px; margin-top: 2px; }
    
    .btn-add-search {
      background: #1C1F28;
      color: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      margin-top: 4px;
      text-align: center;
    }
    .btn-add-search:hover { background: #282D3B; }

    .empty-state {
      color: #4B5563;
      font-size: 13px;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Left Hero Stage -->
    <aside class="hero-panel">
      <div class="panel-header">
        <div>
          <div class="brand-title">Assistant</div>
          <div class="brand-subtitle">Hands-Free Voice Grounding</div>
        </div>
        <select id="langSelect" class="lang-pill">
          <option value="en-IN">en-IN</option>
          <option value="en-US">en-US</option>
          <option value="en-GB">en-GB</option>
          <option value="hi-IN">hi-IN</option>
          <option value="es-ES">es-ES</option>
        </select>
      </div>

      <div class="orb-stage">
        <canvas id="siriOrbCanvas" class="siri-orb-canvas" width="130" height="130"></canvas>
      </div>

      <div id="statusText" class="status-badge">Tap orb & speak naturally</div>
      <div id="transcriptHero" class="transcript-hero">“Auto-detects when you finish speaking”</div>
      <div class="diag-caption">Streaming VAD • 800ms Endpoint</div>

      <div class="input-group">
        <input type="text" id="commandInput" class="command-input" placeholder="Type a grocery request...">
        <div class="btn-row">
          <button id="sendBtn" class="btn-primary">Send</button>
          <button id="clearBtn" class="btn-ghost">Clear</button>
        </div>
      </div>
    </aside>

    <!-- Right Bento Board -->
    <main class="board-stage">
      <div class="toolbar-header">
        <h2 class="section-title">Shopping List</h2>
        <div class="tool-actions">
          <select id="storeSelect" class="lang-pill">
            <option value="Amazon Fresh">Amazon Fresh</option>
            <option value="Blinkit">Blinkit</option>
            <option value="Zepto">Zepto</option>
            <option value="Instamart">Instamart</option>
            <option value="BigBasket">BigBasket</option>
          </select>
          <button id="storeCheckoutBtn" class="btn-store">Open in Store ↗</button>
          <button id="copyOrderBtn" class="btn-tool">Copy Order</button>
        </div>
      </div>

      <!-- Recommendations Shelf -->
      <div class="bento-shelf">
        <div class="shelf-label">RECOMMENDED</div>
        <div id="pillRack" class="pill-rack"></div>
      </div>

      <!-- Search Section -->
      <div id="searchSection" class="bento-shelf" style="display: none;">
        <div class="shelf-label">SEARCH RESULTS</div>
        <div id="searchGrid" class="search-grid"></div>
      </div>

      <!-- Categorized Aisles -->
      <div id="aislesContainer" class="aisles-grid">
        <div class="empty-state">Your shopping list is empty. Speak or type to add items.</div>
      </div>
    </main>
  </div>

  <script>
    // ─── SIRI LIVING ORB ANIMATION (60 FPS) ───
    const canvas = document.getElementById('siriOrbCanvas');
    const ctx = canvas.getContext('2d');
    let isRecording = false;
    let isSpeaking = false;
    let phase = 0.0;
    let energy = 0.05;
    let targetEnergy = 0.05;

    function renderOrb() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseR = 42.0 + (energy * 12.0);

      // Ambient Glow
      if (isRecording || isSpeaking) {
        const aura = ctx.createRadialGradient(cx, cy, baseR * 0.5, cx, cy, baseR * 1.5);
        if (isSpeaking) {
          aura.addColorStop(0, 'rgba(255, 100, 60, 0.4)');
          aura.addColorStop(0.5, 'rgba(140, 70, 255, 0.2)');
        } else {
          aura.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
          aura.addColorStop(0.5, 'rgba(99, 102, 241, 0.15)');
        }
        aura.addColorStop(1, 'rgba(8, 9, 12, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(cx, cy, baseR * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Organic Wave Path
      ctx.beginPath();
      const points = 64;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * 2 * Math.PI;
        const wave1 = Math.sin(angle * 3 + phase) * (energy * 8.0);
        const wave2 = Math.cos(angle * 5 - phase * 1.5) * (energy * 4.0);
        const r = baseR + wave1 + wave2;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      if (isRecording || isSpeaking) {
        grad.addColorStop(0, '#FF5252');
        grad.addColorStop(0.35, '#FF7A00');
        grad.addColorStop(0.7, '#7928CA');
        grad.addColorStop(1, '#0070F3');
      } else {
        grad.addColorStop(0, '#181A22');
        grad.addColorStop(0.5, '#1E212B');
        grad.addColorStop(1, '#14161E');
      }

      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = isRecording || isSpeaking ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Center Glyph
      ctx.fillStyle = isRecording || isSpeaking ? '#FFFFFF' : '#6B7280';
      ctx.font = '600 16px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isSpeaking ? '●' : (isRecording ? '...' : '🎙'), cx, cy);

      const speed = isSpeaking ? 0.05 : (isRecording ? 0.025 : 0.01);
      phase += speed;
      energy += (targetEnergy - energy) * 0.16;

      requestAnimationFrame(renderOrb);
    }
    requestAnimationFrame(renderOrb);

    // ─── DUAL ENGINE SPEECH CAPTURE ───
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let silenceStart = null;
    let hasSpoken = false;
    let speechRecognizer = null;
    let liveBrowserTranscript = '';

    canvas.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      if (!isRecording) {
        startAudioRecording();
      } else {
        stopAudioRecording();
      }
    }

    async function startAudioRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        isRecording = true;
        hasSpoken = false;
        silenceStart = null;
        targetEnergy = 0.2;
        document.getElementById('statusText').textContent = 'Listening... (speak your items)';
        document.getElementById('statusText').style.color = '#38BDF8';
        document.getElementById('transcriptHero').textContent = 'Listening... Speak your items';

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const checkVolume = () => {
          if (!isRecording) return;
          analyser.getByteFrequencyData(dataArray);
          const sum = dataArray.reduce((a, b) => a + b, 0);
          const avg = sum / dataArray.length;
          targetEnergy = Math.min(1.0, Math.max(0.08, avg / 40.0));

          if (avg > 7) {
            hasSpoken = true;
            silenceStart = null;
            document.getElementById('statusText').textContent = 'Hearing you speak...';
          } else if (hasSpoken) {
            if (!silenceStart) silenceStart = Date.now();
            else if (Date.now() - silenceStart > 900) {
              stopAudioRecording();
              return;
            }
          }

          requestAnimationFrame(checkVolume);
        };
        checkVolume();

        audioChunks = [];
        let mime = 'audio/webm';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';

        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = uploadRecordedAudio;
        mediaRecorder.start(250);

      } catch (err) {
        document.getElementById('statusText').textContent = 'Microphone error: ' + err.message;
        isRecording = false;
      }
    }

    function stopAudioRecording() {
      if (isRecording) {
        isRecording = false;
        targetEnergy = 0.05;
        document.getElementById('statusText').textContent = 'Processing with Gemini DSP...';
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        if (audioContext) audioContext.close();
      }
    }

    async function uploadRecordedAudio() {
      if (audioChunks.length === 0) {
        document.getElementById('statusText').textContent = 'No voice audio captured. Tap orb and speak.';
        return;
      }

      const blob = new Blob(audioChunks, { type: mediaRecorder ? mediaRecorder.mimeType : 'audio/webm' });
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');

      try {
        const resp = await fetch('/api/voice-audio', { method: 'POST', body: formData });
        if (resp.ok) {
          const data = await resp.json();
          handleBackendResponse(data);
        } else {
          const errData = await resp.json().catch(() => ({}));
          document.getElementById('statusText').textContent = 'Notice: ' + (errData.error || 'Server error');
        }
      } catch (err) {
        document.getElementById('statusText').textContent = 'Network error: ' + err.message;
      }
    }

    // ─── TEXT COMMAND DISPATCH ───
    const commandInput = document.getElementById('commandInput');
    document.getElementById('sendBtn').addEventListener('click', handleTextSubmit);
    commandInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleTextSubmit(); });

    async function handleTextSubmit() {
      const text = commandInput.value.trim();
      if (!text) return;
      commandInput.value = '';
      document.getElementById('statusText').textContent = 'Processing...';
      document.getElementById('transcriptHero').textContent = `“${text}”`;

      try {
        const resp = await fetch('/api/voice-command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript: text })
        });
        const data = await resp.json();
        handleBackendResponse(data);
      } catch (err) {
        document.getElementById('statusText').textContent = 'Error: ' + err.message;
      }
    }

    document.getElementById('clearBtn').addEventListener('click', async () => {
      await fetch('/api/cart', { method: 'DELETE' });
      document.getElementById('statusText').textContent = 'Cart cleared';
      document.getElementById('transcriptHero').textContent = '“Shopping list is empty”';
      document.getElementById('searchSection').style.display = 'none';
      renderCart({});
    });

    // ─── BACKEND RESPONSE HANDLER ───
    function handleBackendResponse(data) {
      if (!data) return;
      if (data.error) {
        document.getElementById('statusText').textContent = 'Notice: ' + data.error;
        return;
      }

      document.getElementById('transcriptHero').textContent = `“${data.transcript || 'Command'}”`;
      const msgs = Array.isArray(data.messages) ? data.messages.join(' | ') : (data.messages || data.tts_message || 'Cart updated');
      document.getElementById('statusText').textContent = msgs;
      document.getElementById('statusText').style.color = '#9CA3AF';

      renderCart(data.cart || {});
      renderRecommendations(data.seasonal_picks || [], data.history_recs || []);

      if (data.search_results && data.search_results.length > 0) {
        renderSearchResults(data.search_results);
      } else {
        document.getElementById('searchSection').style.display = 'none';
      }

      if (data.tts_message) {
        speakBrowserTTS(data.tts_message);
      }
    }

    function speakBrowserTTS(text) {
      if (!('speechSynthesis' in window)) return;
      isSpeaking = true;
      targetEnergy = 0.6;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = document.getElementById('langSelect').value;
      utter.onend = () => { isSpeaking = false; targetEnergy = 0.05; };
      utter.onerror = () => { isSpeaking = false; targetEnergy = 0.05; };
      window.speechSynthesis.speak(utter);
    }

    // ─── RENDERING CARTS & SHELVES ───
    let currentCartItems = [];

    function renderCart(categorized) {
      const container = document.getElementById('aislesContainer');
      container.innerHTML = '';
      currentCartItems = [];

      const keys = Object.keys(categorized);
      if (keys.length === 0) {
        container.innerHTML = '<div class="empty-state">Your shopping list is empty. Speak or type to add items.</div>';
        return;
      }

      keys.forEach(cat => {
        const items = categorized[cat];
        const card = document.createElement('div');
        card.className = 'aisle-card';

        const header = document.createElement('div');
        header.className = 'aisle-header';
        header.textContent = cat;
        card.appendChild(header);

        items.forEach(itm => {
          currentCartItems.push(itm);
          const row = document.createElement('div');
          row.className = 'item-row';

          const nameContainer = document.createElement('div');
          nameContainer.style.display = 'flex';
          nameContainer.style.alignItems = 'center';
          nameContainer.style.gap = '6px';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'item-name';
          nameSpan.textContent = itm.name;
          nameContainer.appendChild(nameSpan);

          if (itm.brand_hint) {
            const brandBadge = document.createElement('span');
            brandBadge.className = 'brand-badge';
            brandBadge.textContent = itm.brand_hint;
            nameContainer.appendChild(brandBadge);
          }

          const qtySpan = document.createElement('span');
          qtySpan.className = 'item-qty';
          qtySpan.textContent = `${itm.quantity} ${itm.unit}`;

          const actions = document.createElement('div');
          actions.className = 'item-actions';

          const storeLink = document.createElement('button');
          storeLink.className = 'btn-link-store';
          storeLink.innerHTML = '↗';
          storeLink.title = 'Open product page';
          storeLink.onclick = () => openSingleItemStore(itm.name);

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-del';
          delBtn.innerHTML = '×';
          delBtn.title = 'Remove';
          delBtn.onclick = () => removeItem(itm.base_name);

          actions.appendChild(storeLink);
          actions.appendChild(delBtn);

          row.appendChild(nameContainer);
          row.appendChild(qtySpan);
          row.appendChild(actions);
          card.appendChild(row);
        });

        container.appendChild(card);
      });
    }

    function renderRecommendations(seasonal, history) {
      const rack = document.getElementById('pillRack');
      rack.innerHTML = '';

      seasonal.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'suggestion-pill';
        btn.textContent = item;
        btn.onclick = () => quickAddItem(item);
        rack.appendChild(btn);
      });

      history.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'suggestion-pill';
        btn.textContent = '+ ' + item;
        btn.onclick = () => quickAddItem(item);
        rack.appendChild(btn);
      });
    }

    function renderSearchResults(products) {
      const section = document.getElementById('searchSection');
      const grid = document.getElementById('searchGrid');
      grid.innerHTML = '';
      section.style.display = 'flex';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-name">${p.name}</div>
          <div class="product-brand">${p.brand} • Score ${p.nutriscore}</div>
          <div class="product-price">${p.price}</div>
          <button class="btn-add-search" onclick="quickAddItem('${p.name.replace(/'/g, "\\'")}')">+ Add</button>
        `;
        grid.appendChild(card);
      });
    }

    function quickAddItem(name) {
      commandInput.value = `Add 1 ${name}`;
      handleTextSubmit();
    }

    async function removeItem(name) {
      commandInput.value = `Remove ${name}`;
      handleTextSubmit();
    }

    // ─── STORE ACTIONS ───
    function getStoreUrl(item_name) {
      const store = document.getElementById('storeSelect').value;
      const encoded = encodeURIComponent(item_name);
      if (store.includes('Amazon')) return `https://www.amazon.in/s?k=${encoded}&i=nowstore`;
      if (store.includes('Blinkit')) return `https://blinkit.com/s/?q=${encoded}`;
      if (store.includes('Zepto')) return `https://www.zeptonow.com/search?q=${encoded}`;
      if (store.includes('Instamart')) return `https://www.swiggy.com/instamart/search?query=${encoded}`;
      if (store.includes('BigBasket')) return `https://www.bigbasket.com/ps/?q=${encoded}`;
      return `https://www.google.com/search?q=buy+${encoded}`;
    }

    function openSingleItemStore(name) {
      window.open(getStoreUrl(name), '_blank');
    }

    document.getElementById('storeCheckoutBtn').addEventListener('click', () => {
      if (currentCartItems.length === 0) {
        document.getElementById('statusText').textContent = 'Cart is empty - add items first';
        return;
      }
      currentCartItems.forEach(itm => {
        window.open(getStoreUrl(itm.name), '_blank');
      });
    });

    document.getElementById('copyOrderBtn').addEventListener('click', () => {
      if (currentCartItems.length === 0) return;
      const text = 'Shopping List:\n' + currentCartItems.map(i => `• ${i.quantity} ${i.unit} ${i.name} (${i.category})`).join('\n');
      navigator.clipboard.writeText(text);
      document.getElementById('statusText').textContent = 'Copied grocery list to clipboard';
    });

    // Initial Load
    fetch('/api/cart').then(r => r.json()).then(data => {
      renderCart(data.cart || {});
      renderRecommendations(data.seasonal_picks || [], data.history_recs || []);
    }).catch(() => {});
  </script>
</body>
</html>
